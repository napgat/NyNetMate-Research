14" width="719.466" height="170.875" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="573.747" fill="#000" font-size="14" textLength="465.746">Square = UML Port (name suppressed). Socket = required; ball = provided.</text><text x="27" y="591.356" fill="#000" font-size="14" textLength="395.274">Each assembly joins two simple ports for ONE named interface.</text><text x="27" y="608.966" fill="#000" font-size="14" textLength="531.501">role : ComponentType denotes a part; types are logical software-module abstractions.</text><text x="27" y="626.575" fill="#000" font-size="14" textLength="599.895">Contract IDs map to operations and immutable source evidence in README / CONTRACTS.md.</text><text x="27" y="644.185" fill="#000" font-size="14" textLength="689.466">Render uses Jinja2; Remediation uses hier_config; SSH adapter uses Netmiko. They are NOT one component.</text><text x="27" y="661.794" fill="#000" font-size="14" textLength="536.136">db sessions are operation parameters; factory / ORM plumbing is omitted, not inferred.</text><text x="27" y="679.403" fill="#000" font-size="14" textLength="560.349">Main contains SSH push paths but no binding to the CIS gate in the inspected CIS branch.</text><text x="27" y="697.013" fill="#000" font-size="14" textLength="622.521">This is a code structure view, not a deployment approval, hardware-support claim or execution trace.</text></g><?plantuml-src TLRVRzis47xtNt78NbAWpkBVGuq1SnmRor3RWUNrQK11YIUBZKIo9ENCM_k_zqWfjjmeRzRTnxkFTyVlx8JB4LR7DReLSmXTc2kPYdrfc1DAGg8AhIHA1ynQBEBy-8-CMVA4aaF1X8G_e3SUOnyHle5LfKcm6_paLhoasB4g9MT6e2M4LC3n81BqWGickGNy5vFI8U_ac3fm2epOPmwuC9Xu2Xtx9AHcXXLdCf4xKkIooFiDhyqOLyz2xY5bkSM6XsFAojmjbNHhLY14JDe8ZKZRCP7u3w4tQ3YbucXHms3KC1ecdxnnr3HgnhcdqBjjutr7bTaRNv2vofM1NvQJvTrosGfLXgEfOOFUQ3RvxOAGmzV1bikxnQnpRjdLPIzNJB8z5jvpRJ6dybANX7He9Cl1EbCchZJuxefwNOz1TBGE2_Y_qnY4gmCQI_4iVAXHdoh3AZGydFxq0g6Je9LnggI347pRp_FRNhjvKfjfhchh8ra77VX-GO1Jwzmf-xt_QkGEtsybxhURNwNGEPFID_8bosDjQ2HwCRsLQzXk7hMRn