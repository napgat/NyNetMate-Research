,183.148 A10,10 0 0 0 1166.179 197.29" fill="none" style="stroke:#181818;stroke-width:1.5;"/><ellipse cx="1173.25" cy="190.219" rx="6" ry="6" fill="#FFF" style="stroke:#181818;stroke-width:1.5;"/></g><!--link R_N05 to P_N05--><g class="link" data-entity-1="ent0011" data-entity-2="ent0016" id="lnk21" data-source-line="37" data-link-type="association"><path d="M1600.02,274.239 C1627.98,274.379 1764.34,275.049 1792.79,275.189" style="stroke:#181818;stroke-width:1;" fill="none" id="R_N05-P_N05"/><text x="1646" y="254.714" fill="#000" font-size="13" textLength="101.88">N05: ISnmpClient</text><path d="M1689.185,267.608 A10,10 0 0 0 1689.115 281.75" fill="none" style="stroke:#181818;stroke-width:1.5;"/><ellipse cx="1696.221" cy="274.714" rx="6" ry="6" fill="#FFF" style="stroke:#181818;stroke-width:1.5;"/></g><g class="legend" data-source-line="39"><rect x="12" y="439.219" width="675.101" height="153.266" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="468.752" fill="#000" font-size="14" textLength="465.746">Square = UML Port (name suppressed). Socket = required; ball = provided.</text><text x="27" y="486.361" fill="#000" font-size="14" textLength="395.274">Each assembly joins two simple ports for ONE named interface.</text><text x="27" y="503.971" fill="#000" font-size="14" textLength="531.501">role : ComponentType denotes a part; types are logical software-module abstractions.</text><text x="27" y="521.58" fill="#000" font-size="14" textLength="599.895">Contract IDs map to operations and immutable source evidence in README / CONTRACTS.md.</text><text x="27" y="539.189" fill="#000" font-size="14" textLength="645.101">Both directions between Devices and Collection are real service contracts, not request/response arrows.</text><text x="27" y="556.799" fill="#000" font-size="14" textLength="563.397">HTTP routes, SQLAlchemy sessions and health/topology internals are deliberately omitted.</text><text x="27" y="574.408" fill="#000" font-size="14" textLength="566.467">Discovery is permitted only in an isolated lab; this work performed no network or device I/O.</text></g><?plantuml-src TLLDRziu4BthLmoobnIedTYEsqMA0dNyWGQe7M_alHLOKDBOOaDnL99AgjtjVzyXvRMKH3s96ZxEl7b3FJdf5CAwtg1R2uSm05uzaNc0jT3YW0Lg1oaL9MbUsQyw4Ua3wWmA8JLyWj6xTpX6X7_1eiBKOGPIEpHQA3wcdH6fixoh2L93rWuI8tIQWx0MYqJLaSAz0qTWv25ta4d3IIJfo3v8NGeZYhPwx6hcMXLgtDcrkSZeIUe3x8MosDd9S2ygvLRCOYCAX5Xe6wEH-tvCBFz664qwcveoj5Z2PDe9Clq77vnsWwN8CazXTDd7-uObEnYgT3OdHGP-MxrVtQnMlL0o6PeZR3AQpjx__eoGmzV9LgkRvImwfO2prnCyOxt_7snSMuS5_1D1vqY6Zp952zUm2AiNHnV7RJu49Hb75P-1i7N_r-Poz3gyvV0uWf_FggIaL3DUBdIaCp_5mhdszLICxrcdrhYVmgG_VFKgnxRXsqkCvRo6M_t8CJ9rFpF6_4A5QMyjJypF3SvU9YOpFDOzV_DLdoWCo_fvlTkYL64K8dmOBwZJ3ocyd7V-kQrTVgGRtdiqtFvIbMb87UO9W_FBGIELdzJbY6NP2ND0ruhIGCSjT1oWOuR6MfGs9pShIoLJqQ8dBNeIq1D6zmZUeAzQz5L0Np4wzBMGDgL7D7K3dBR0QG1E0ucYd2l9gQEVx387Rre9EKS5UC-98FvU2OFm4VvSVu4jom7dslk4hShI8FjJzcO8CR7TEGOP_5wnEMKV815ASQ0qz2Wpp8OHB4N7qU0RIMs1BpTOwKSNfBQmvvjpjrc2ht4qoRr8aOyROj0r3_mur5rT8ZkJlpKM19kBSH_0SP3VcB2Y0ukgmDBUFN5WK51MSGQHs62th9_bhFEZ-yBjmh9RbzvagKGJni6PM0vP59KJ2P-rL9aK0Nr7cXTyC-wNiyLw2HSmlzlixcVpNJmiVBCtvFBMfoqa_1qZwfD7-CIThzWpDkZfel60zg_mrdyNGLUqxe8Lv-ujjs4CFVa6FkzsMzQcOXNUGlp7bvbASongJcJjgOMSKxlymb79RdYeJp-VHgeCbKnyoyXpeK8w5-PrkZuWBR0apGQGLZu1v-KuAU5ZIYIiVSwuOAaCvZdw0V8FJHzzbWVR-2VSNjmD8xvepNNx3m00?></g></svg>