/g><g class="legend" data-source-line="48"><rect x="12" y="546.214" width="638.508" height="153.266" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="27" y="575.747" fill="#000" font-size="14" textLength="465.746">Square = UML Port (name suppressed). Socket = required; ball = provided.</text><text x="27" y="593.356" fill="#000" font-size="14" textLength="395.274">Each assembly joins two simple ports for ONE named interface.</text><text x="27" y="610.966" fill="#000" font-size="14" textLength="531.501">role : ComponentType denotes a part; types are logical software-module abstractions.</text><text x="27" y="628.575" fill="#000" font-size="14" textLength="599.895">Contract IDs map to operations and immutable source evidence in README / CONTRACTS.md.</text><text x="27" y="646.185" fill="#000" font-size="14" textLength="578.881">Writer receives the caller-owned db session in AuditWriter; it does NOT call a session factory.</text><text x="27" y="663.794" fill="#000" font-size="14" textLength="464.557">The writer adds and flushes an AuditLog; the caller owns commit / rollback.</text><text x="27" y="681.403" fill="#000" font-size="14" textLength="608.508">HTTP routers and permission-boundary internals are omitted; see the separate web-contract view.</text></g><?plantuml-src VLPTRnev57tdLrobB-a32Hy1gaGhBKb0MwcG2AZwijBACxw0DpFsrFQ0QBV_VOzdXZ1DXxunryVtt2-VYrS-OPeTvkndmZErQPpxBMklOk6LqNGDWrIUOfDcHkE0X7ESHidXRns9-8Mrf3KBdrk-xdRR8e3RUwiyM_gJeW_3NZpiq7yaiYofVBRDNhE4H-sjYBrh9Rpsv0rPjTbwaifo770jzw9q9gn8J-nBVq2yUPhqQgTkAwJPAxsXjKWSrquahqMU-2cevY9bMWhjbcpLkXcpLD-OkltQeJQI7MVK7zICLkYNO1pKZPcGCeJGxJJ5VOzIRQp9jNmmYR7qRZgQta-dZL1Z9TiArkyEngCFFmNa-LTdq-dzPDmwzUZYJ1Sl7ISeBgglD3gaHKBEspmExNj_WTOMxLyUdEUKlhTgNRyGEA3RD-E1MkvKpAytmntAZFKcnnKgx8j_nfrki_ccCYjzj3x3EchHZv-e8sCymXGP-3yxji_Mx9G3FUfTtBf_1PpXxpMR1s-PX1HPcDmopw9cuz8qCp9FgaGhq1ckVcDItKPhxsq0rSkvBVirpZAyhnhrb_BuUwEp_bjdbeKyELlWg-PgKHwUIMBORFwbDL9u4Gd787ciVYvoZ4TQaXnjPo9kxl-WqJeig8jXelPbfrrMDIJNwTxInmN7U3UXQvCT8