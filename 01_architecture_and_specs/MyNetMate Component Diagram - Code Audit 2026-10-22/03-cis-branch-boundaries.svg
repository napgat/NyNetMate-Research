oftware-module abstractions.</text><text x="27" y="587.58" fill="#000" font-size="14" textLength="599.895">Contract IDs map to operations and immutable source evidence in README / CONTRACTS.md.</text><text x="27" y="605.189" fill="#000" font-size="14" textLength="542.445">Header identity is an unverified development bridge, not session-backed authentication.</text><text x="27" y="622.799" fill="#000" font-size="14" textLength="603.114">LogAuditModule does not write shared AuditLog rows; no shared Audit Writer binding is asserted.</text><text x="27" y="640.408" fill="#000" font-size="14" textLength="540.066">db is passed from the HTTP boundary to SecurityValidation as an operation parameter.</text><text x="27" y="658.018" fill="#000" font-size="14" textLength="565.312">No connection to main's deployment or a CIS frontend is present in the inspected revisions.</text></g><?plantuml-src TLLTR-Cs47pthrYa3yq1TSwVTq620hKT6mbmSGBBRLyA59Iujjb8f8wa4hZj_VSRKdOi9xutQJcx7EuiXrxvdEb-EsT_BpnJcoPt2JsBN4dXbT6KcQ8qchKduHmNQRxzIwSYUs8jQSN2LvO_TYxRcN9jnrbbbT-s6-c_KMVrQIZb9VrFyuSbocdDcMT9tb0Xb2R9PMws1NPevRpo8MxLUkD9AWiaYhJSazAbiA8ui4dy5hoh8kyrLjr6IFEYz9fM8dVSM96y4bNkPqRxkIYO4g5TmbQjJcCIzIzJjzzOr4QouvBwmqRG2lqKWiDci1HI1WhTpYdUOxHkRKsbvSJanj9Fiy-pyMns4cgiPBk3zRl3qUVB8qAUtnURpSRJKUkWsLbGyu-37ESfE6URTcuoaPFIdgt6X_EsoeAK7yuWSnY1PEiy5_HVgp40PnllIxgYPAVpBNx7ONTXjp7lThby32bK6kjDXGoAySNVIQTxEjmx7UwtwDlHrllPQcn_E5PCsuT_H61mEZpSXJ69k-XZpVPuVzPhfHcxBwgSf_7dtaXynvGwyBhpSQt1sreYyn3hYcvPGE0xYI1uDygD8k1qjTwxQfLK7jM-cFKeV3RhnANJTOPlww2L8XKkdF5czxcemAoeQ-rZFoXN2nQ5flPvfrrtCQZLwLxHtLwSXv9jbCpLuDu1t8lW7i3n-0kJymsNi1dMsRP6zm_eVaJtWLxmrugTJzWvr7sRCZYa36BA02aJerTg7PM4LLMHK0qV7k3321y2Fevt9ZPpmHbkPUiRh6eT730rtfk2Wd6rAFbQ2SlqA_r-_uKUqI8wry5iN5MM5lHOVhYWnC0xFK0MlE5myffIaUS8bDOyAydoeaLJaMrU_PR-CKexyY-6d2fAs5velwCLPkHXFgMmXwplyafaZ7IBte7zP2_kSbiox2rOXYC1XxB-cZo2-0FXtAnLi0DdLlu5WNOHHuX42byGqO8Tgg9hyPVkRXoikmnERLxr985sgAAeC2R8TQQo6HE74sbyO5eMqz7D_PG-qkHXlboC9ilaeWY7hQy1gTqz81LgKQMVWpyh74toC-Uc34y4fLR9DVyIx8zSBNaxFaUI